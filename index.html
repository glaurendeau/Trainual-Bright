<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bright Conseil — Saisie hebdomadaire collaborateur & dashboard dirigeant" />
  <title>Bright Conseil — Saisie Hebdomadaire</title>

  <!-- Styles -->
  <link rel="stylesheet" href="src/app.css" />

  <!-- Favicone SVG inline -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230A0F1E' stroke='%233B82F6' stroke-width='2'/><circle cx='16' cy='16' r='5' fill='%233B82F6'/></svg>" />
</head>
<body>

  <!-- Point de montage principal -->
  <div id="app">
    <!-- Écran de chargement initial -->
    <div style="
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #94A3B8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    ">
      <div style="
        width: 48px; height: 48px;
        border-radius: 12px;
        background: rgba(59,130,246,0.15);
        border: 2px solid #3B82F6;
        display: flex; align-items: center; justify-content: center;
        font-weight: 800; font-size: 1rem; color: #3B82F6;
        animation: spin 1s linear infinite;
      ">BC</div>
      <p style="font-size: 0.9rem;">Chargement…</p>
      <style>@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }</style>
    </div>
  </div>

  <!-- ─── Scripts (ordre important : data → storage → status → utils → charts → forms → dashboard → app) ─── -->
  <script src="src/data.js"></script>
  <script src="src/storage.js"></script>
  <script src="src/status.js"></script>
  <script src="src/utils.js"></script>
  <script src="src/charts.js"></script>
  <script src="src/forms.js"></script>
  <script src="src/dashboard.js"></script>
  <script src="src/app.js"></script>

</body>
</html>
